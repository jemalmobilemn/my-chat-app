<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Chat AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>🤖 My Chat AI</h1>
    <button id="clearBtn">Clear</button>
  </header>

  <main id="chatBox" class="chat-box">
    <div class="message bot">
      👋 ሰላም! እንዴት ልርዳህ?
    </div>
  </main>

  <form id="chatForm" class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="መልዕክት ይጻፉ..."
      autocomplete="off"
      required
    >

    <button type="submit" id="sendBtn">
      ➤
    </button>

  </form>

  <script src="app.js"></script>

</body>
</html>
