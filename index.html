<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bon Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="logo">💬 Bon Chat</div>
    <div id="userStatus">Not signed in</div>
  </header>


  <!-- LOGIN / SIGN UP -->

  <section id="authSection" class="card">

    <h2>Welcome to Bon Chat</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <input
      id="username"
      type="text"
      placeholder="Username"
    >

    <input
      id="phone"
      type="tel"
      placeholder="Phone Number"
    >

    <div class="buttons">

      <button id="signupBtn">
        Create Account
      </button>

      <button id="loginBtn">
        Login
      </button>

    </div>

    <p id="authMessage"></p>

  </section>


  <!-- MAIN APP -->

  <main id="appSection" style="display:none;">


    <!-- FIND PEOPLE -->

    <section id="findPeople" class="card">

      <h2>👥 Find Friends</h2>

      <input
        id="searchUser"
        type="tel"
        placeholder="Search by phone number..."
      >

      <button id="searchBtn">
        🔍 Search
      </button>

      <div id="userResults"></div>

    </section>


    <!-- FRIEND REQUESTS -->

    <section id="requestsSection" class="card">

      <h2>🔔 Friend Requests</h2>

      <div id="friendRequests">
        <p>No friend requests.</p>
      </div>

    </section>


    <!-- FRIENDS -->

    <section id="friendsSection" class="card">

      <h2>👥 My Friends</h2>

      <div id="friendsList">
        <p>No friends yet.</p>
      </div>

    </section>


    <!-- CHAT -->

    <section
      id="chatBox"
      class="card"
      style="display:none;"
    >

      <button id="backToUsers">
        ← Back
      </button>

      <h2 id="chatTitle">
        Chat
      </h2>

      <div id="messages"></div>

      <div class="messageInput">

        <input
          id="messageText"
          type="text"
          placeholder="Write a message..."
        >

        <button id="sendMessage">
          Send
        </button>

      </div>

    </section>


    <button
      id="logoutBtn"
      class="logout"
    >
      Logout
    </button>

  </main>


  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
