<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bon Chat</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">💬 Bon Chat</div>
    <div id="userStatus">Not signed in</div>
  </header>


  <!-- LOGIN / SIGN UP SECTION -->
  <section id="authSection" class="card">

    <h2>Welcome to Bon Chat</h2>

    <div class="form-group">
      <input
        id="email"
        type="email"
        placeholder="Email Address"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <input
        id="username"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="phone"
        type="tel"
        placeholder="Phone Number (e.g. 0912345678)"
        autocomplete="tel"
      >
    </div>

    <div class="buttons">
      <button id="signupBtn" type="button">
        Create Account
      </button>

      <button id="loginBtn" type="button">
        Login
      </button>
    </div>

    <p id="authMessage" class="auth-message"></p>

  </section>


  <!-- MAIN APP SECTION -->
  <main id="appSection" style="display:none;">

    <!-- FIND FRIENDS -->
    <section id="findPeople" class="card">

      <h2>👥 Find Friends</h2>

      <!-- Phone Contacts Sync Button -->
      <button id="importContactsBtn" type="button" class="contacts-btn" style="width: 100%; padding: 10px; margin-bottom: 12px; cursor: pointer;">
        🎴 Sync Phone Contacts
      </button>

      <div style="text-align: center; color: #888; margin-bottom: 12px;">─── OR ───</div>

      <!-- Search Box (By Name or Phone) -->
      <div class="search-box">
        <input
          id="searchUser"
          type="text"
          placeholder="Search by name or phone..."
        >

        <button id="searchBtn" type="button">
          🔍 Search
        </button>
      </div>

      <div id="userResults"></div>

    </section>


    <!-- FRIEND REQUESTS -->
    <section id="requestsSection" class="card">

      <h2>🔔 Friend Requests</h2>

      <div id="friendRequests">
        <p>No friend requests.</p>
      </div>

    </section>


    <!-- MY FRIENDS -->
    <section id="friendsSection" class="card">

      <h2>👥 My Friends</h2>

      <div id="friendsList">
        <p>No friends yet.</p>
      </div>

    </section>


    <!-- CHAT BOX -->
    <section
      id="chatBox"
      class="card"
      style="display:none;"
    >

      <div class="chat-header">
        <button id="backToUsers" type="button">
          ← Back
        </button>

        <h2 id="chatTitle">
          Chat
        </h2>
      </div>

      <div id="messages" class="messages-container"></div>

      <div class="messageInput">

        <input
          id="messageText"
          type="text"
          placeholder="Write a message..."
          autocomplete="off"
        >

        <button id="sendMessage" type="button">
          Send
        </button>

      </div>

    </section>


    <!-- LOGOUT BUTTON -->
    <div class="logout-wrapper">
      <button
        id="logoutBtn"
        class="logout"
        type="button"
      >
        Logout
      </button>
    </div>

  </main>


  <!-- JAVASCRIPT MODULE -->
  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
